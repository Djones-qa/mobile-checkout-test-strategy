name: Appium — Cross-Platform

on:
  push:
    branches: [master]
  schedule:
    # Nightly at 02:00 UTC
    - cron: "0 2 * * *"

jobs:
  appium-validate:
    name: Appium Config Validation — ${{ matrix.platform }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, Android]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Appium
        run: npm install -g appium@3.4.2

      - name: List available Appium drivers
        run: appium driver list

      - name: Validate WebdriverIO config
        run: npx wdio config validate ./appium/wdio.conf.js || true

      - name: TypeScript type-check (Appium page objects)
        run: npx tsc --noEmit -p tsconfig.appium.json

      - name: Verify Appium test files exist
        run: |
          echo "=== Appium test files ==="
          find appium/tests -name "*.test.ts" | sort
          COUNT=$(find appium/tests -name "*.test.ts" | wc -l)
          echo "Total: $COUNT test files"
          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: No test files found"
            exit 1
          fi

      - name: Validate Maestro flows
        run: |
          echo "=== Maestro flow files ==="
          find maestro/flows -name "*.yaml" | sort
          COUNT=$(find maestro/flows -name "*.yaml" | wc -l)
          echo "Total: $COUNT flow files"
          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: No Maestro flows found"
            exit 1
          fi
