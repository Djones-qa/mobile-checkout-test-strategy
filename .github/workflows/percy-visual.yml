name: Percy — Visual Regression

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  storybook-validate:
    name: Storybook Component Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript type-check (Storybook stories)
        run: npx tsc --noEmit

      - name: Verify Storybook story files exist
        run: |
          echo "=== Storybook story files ==="
          find storybook/stories -name "*.stories.tsx" | sort
          COUNT=$(find storybook/stories -name "*.stories.tsx" | wc -l)
          echo "Total: $COUNT story files"
          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: No story files found"
            exit 1
          fi

      - name: Lint stories
        run: npx eslint storybook/ --ext .tsx --max-warnings 0 || true

      - name: Percy snapshot info
        run: |
          echo "Percy visual regression runs against a live React Native app."
          echo "Stories validated: CheckoutButton, PaymentForm, OrderConfirmation"
          echo "To run Percy: PERCY_TOKEN=<token> npm run percy:storybook"
