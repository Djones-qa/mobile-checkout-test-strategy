name: Percy — Visual Regression

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  percy-storybook:
    name: Percy Visual Snapshot — Storybook
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run storybook -- --ci --smoke-test

      - name: Run Percy visual snapshots
        run: npm run percy:storybook
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}

  percy-detox-screenshots:
    name: Percy Visual Snapshot — Detox Screenshots
    runs-on: macos-14
    needs: []

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Detox CLI
        run: npm install -g detox-cli@20.18.0

      - name: Install CocoaPods
        run: cd ios && pod install --repo-update

      - name: Build iOS app
        run: npm run detox:build:ios

      - name: Run Detox with Percy screenshots
        run: |
          detox test \
            --configuration ios.sim.debug \
            --take-screenshots all \
            --artifacts-location ./percy-screenshots
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}

      - name: Upload screenshots to Percy
        run: npx @percy/cli upload ./percy-screenshots
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
