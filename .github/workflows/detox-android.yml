name: Detox — Android Emulator

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  detox-android:
    name: Detox Config Validation — Android API ${{ matrix.api-level }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 31]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Detox CLI
        run: npm install -g detox-cli@20.50.4

      - name: Validate Detox config
        run: detox config validate

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Lint test files
        run: npx eslint detox/ --ext .ts --max-warnings 0 || true

      - name: Verify test files exist
        run: |
          echo "=== Detox test files ==="
          find detox/tests -name "*.test.ts" | sort
          COUNT=$(find detox/tests -name "*.test.ts" | wc -l)
          echo "Total: $COUNT test files"
          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: No test files found"
            exit 1
          fi
